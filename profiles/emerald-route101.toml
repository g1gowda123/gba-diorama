# Emerald Route 101 overworld, captured from mGBA frame 4800 at 2x scale.
#
# This is an example profile, not a hardcoded game rule. Pass it explicitly:
#   python -m gba_diorama --dump <dir> --profile profiles/emerald-route101.toml
#
# The dump hook does not emit mGameInfo yet, so matching is by scene signature
# only. Once game info is in meta.json, add:
#   game_code = "BPEE"

[[profiles]]
name = "emerald-route101"

[profiles.match]
mode = 0
enabled = 0b1111
priorities = [0, 1, 2, 3]
affine_mask = 0
screen_sizes = [0, 0, 0, 0]

# BG3 is a low-detail checkerboard backdrop in this scene; BG2 is the world.
# Canopy relief runs automatically on the composited ground: saturated-green
# tree blobs are split into components, lifted into a 4px heightfield, and
# filled underneath with surrounding ground color.
[[profiles.layers]]
bg = 3
role = "ignore"

[[profiles.layers]]
bg = 2
role = "ground"
height = 0.0
material = "ground"
side_material = "dirt"

# Sparse BG1 foreground (tall grass/canopy fragments). Optional; the main tree
# canopies live in BG2 and are handled by relief.py.
[[profiles.layers]]
bg = 1
role = "foreground"
height = 10.0
material = ""
side_material = "grass"

[[profiles.layers]]
bg = 0
role = "ui"
flat = true

# Optional camera override. A slightly higher pitch and closer distance make
# the screen-sized slab read as a diorama.
[profiles.camera]
pitch_deg = 30.0
distance = 560.0
yaw_deg = 8.0
